name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"   # Mondays: make sure every upstream still resolves
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit + end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Shellcheck
        run: |
          # gcc format → GitHub annotations on the exact line
          shellcheck -x -f gcc install.sh refresh.sh scripts/common.sh \
            | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (error|warning|note): (.*)$/::\4 file=\1,line=\2,col=\3::\5/; s/^::note /::notice /'
          exit "${PIPESTATUS[0]}"

  upstream:
    # Catches upstreams that renamed their files or moved (asset regex no longer matches).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve latest releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./crescue check --json > upstream.json
          rc=$?
          python - <<'EOF'
          import json, os
          d = json.load(open("upstream.json"))
          rows = ["| tool | status | latest | file |", "|---|---|---|---|"]
          for k, v in sorted(d.items()):
              if "error" in v:
                  print(f"::error title={k}::{v['error']}")
                  rows.append(f"| {k} | ❌ | | {v['error'][:120]} |")
              else:
                  print(f"::notice title={k}::{v.get('latest') or '—'}  {v.get('file') or ''}")
                  rows.append(f"| {k} | ✅ | {v.get('latest') or '—'} | {v.get('file') or ''} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(rows) + "\n")
          EOF
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream
          path: upstream.json

  fetch:
    # Real downloads + checksum verification of everything small enough to be quick.
    runs-on: ubuntu-latest
    needs: upstream
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRESCUE_CACHE: ${{ runner.temp }}/crescue
          NO_COLOR: "1"
        run: |
          set -o pipefail
          ./crescue fetch 2>&1 | tee fetch.log
          rc=$?
          grep -E '^(✓|✗|!)' fetch.log | while IFS= read -r l; do
            case $l in
              ✗*) echo "::error title=fetch::${l#✗ }" ;;
              !*) echo "::warning title=fetch::${l#! }" ;;
              *)  echo "::notice title=fetch::${l#✓ }" ;;
            esac
          done
          du -sh "$CRESCUE_CACHE"/* 2>/dev/null | sed 's/^/::notice title=size::/'
          exit $rc
