name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release this build as a version, e.g. v0.1.0 (main only; empty = just build)"
        required: false
        default: ""

permissions:
  contents: read    # the release job alone may write (below)

jobs:
  app:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: App tests (PowerShell and Ventoy faked)
        run: python -m unittest tests.test_windows_app -v

      - name: Build HelixBoot.exe
        run: |
          # Pillow: the Look window's previews. certifi: HTTPS to sites whose root Windows hasn't fetched yet
          pip install --disable-pip-version-check --require-hashes -r windows/requirements.txt
          pyinstaller --noconfirm windows/HelixBoot.spec

      - name: The .exe says what it is (Properties > Details)
        shell: pwsh
        run: |
          $info = (Get-Item dist\HelixBoot.exe).VersionInfo
          $want = (Select-String -Path helix -Pattern '^__version__ = "([\d.]+)"').Matches[0].Groups[1].Value
          $info | Format-List ProductName, ProductVersion, FileVersion, CompanyName, OriginalFilename
          if ($info.ProductName -ne "Helix Boot") { throw "no product name in the .exe" }
          if ($info.ProductVersion -ne $want) { throw "the .exe says version $($info.ProductVersion), helix says $want" }

      - name: Smoke test the real .exe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = "$env:RUNNER_TEMP\app"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item dist\HelixBoot.exe $dir
          $exe = "$dir\HelixBoot.exe"
          function Run([string]$argv, [int]$minutes = 10) {
            Write-Host "::group::HelixBoot $argv"
            $p = Start-Process $exe -ArgumentList $argv -PassThru -NoNewWindow
            $finished = $p.WaitForExit($minutes * 60000)
            if (-not $finished) { Stop-Process -Id $p.Id -Force }
            Get-Content "$dir\helix-boot.log" -Tail 40
            Write-Host "::endgroup::"
            if (-not $finished) { throw "HelixBoot $argv hung for $minutes minutes (log above)" }
            if ($p.ExitCode) { throw "HelixBoot $argv exited $($p.ExitCode)" }
          }
          Run "--list --all"                                  # PowerShell Get-Disk, every disk
          Run "--list"                                        # USB only: the runner has none
          Run "--fetch ventoy supergrub2 memtest86plus"       # the Windows Ventoy .zip, verified
          $v = Get-ChildItem "$env:LOCALAPPDATA\HelixBoot\cache\ventoy\*\Ventoy2Disk.exe"
          if (-not $v) { throw "Windows Ventoy package wasn't unpacked" }
          New-Item -ItemType Directory "$env:RUNNER_TEMP\stick" | Out-Null   # stands in for a mounted stick
          Run "--sync-to $env:RUNNER_TEMP\stick --init"
          foreach ($f in "ventoy\ventoy.json", "Apps\HelixApps.cmd", "ventoy\theme\theme.txt") {
            if (-not (Test-Path "$env:RUNNER_TEMP\stick\$f")) { throw "missing on the stick: $f" }
          }
          Get-ChildItem -Recurse "$env:RUNNER_TEMP\stick\ISO" | Select-Object FullName, Length

          # Ventoy's boot script, changed as on Linux. Ventoy's own partition has no drive letter, so a
          # virtual disk with a letterless VTOYEFI volume stands in for it, reached by its volume id.
          $vhd = "$env:RUNNER_TEMP\vtoyefi.vhd"
          Set-Content "$env:RUNNER_TEMP\diskpart.txt" -Encoding ascii -Value @(
            "create vdisk file=`"$vhd`" maximum=64 type=fixed", "attach vdisk", "create partition primary",
            "format fs=fat label=VTOYEFI quick")
          diskpart /s "$env:RUNNER_TEMP\diskpart.txt"
          if ($LASTEXITCODE) { throw "diskpart couldn't make the virtual disk" }
          $vol = Get-Volume | Where-Object FileSystemLabel -eq 'VTOYEFI' | Select-Object -First 1
          if (-not $vol) { throw "Windows doesn't show the VTOYEFI volume" }
          if ($vol.DriveLetter) {
            Get-Partition -DriveLetter $vol.DriveLetter | Remove-PartitionAccessPath -AccessPath "$($vol.DriveLetter):\"
          }
          $efi = $vol.Path                                    # \\?\Volume{...}\
          [IO.Directory]::CreateDirectory("${efi}grub") | Out-Null
          [IO.File]::WriteAllText("${efi}grub\grub.cfg", (@(
            "function legacy_iso_memdisk {", "}", "function uefi_iso_memdisk {", "}", 'set VTOY_HELP_CMD="a"',
            'set VTOY_LANG_CMD="b"', "#clear all input key before show main menu", "vt_clear_key", "") -join "`n"))
          Run "--sync-to $env:RUNNER_TEMP\stick --boot-script $efi"
          $script = [IO.File]::ReadAllText("${efi}grub\grub.cfg")
          if ($script -notmatch "helix-boot splash: begin" -or $script -notmatch "helix-keys.cfg") { throw "Ventoy's boot script wasn't changed" }
          if (-not (Test-Path "$env:RUNNER_TEMP\stick\ventoy\helix-keys.cfg")) { throw "the keys' script isn't on the stick" }
          if ((Get-Content -Raw "$env:RUNNER_TEMP\stick\ventoy\theme\theme.txt") -notmatch "key_power.png") { throw "the menu doesn't show the power key" }

          # The stick's look: a preset with the icons off, a preview drawn by the bundled Pillow, the window
          Run "--look $env:RUNNER_TEMP\stick --theme midnight --icons off"
          $theme = Get-Content -Raw "$env:RUNNER_TEMP\stick\ventoy\theme\theme.txt"
          if ($theme -notmatch "Midnight" -or $theme -notmatch "icon_width = 0") { throw "the look wasn't applied" }
          if (Test-Path "$env:RUNNER_TEMP\stick\ventoy\theme\icons") { throw "icons are still on the stick" }
          if (-not (Test-Path "$env:RUNNER_TEMP\stick\ventoy\theme\splash\20.jpg")) { throw "no loading bar: Pillow isn't in the .exe" }
          Run "--look $env:RUNNER_TEMP\stick --theme ember --preview $env:RUNNER_TEMP\preview.png"
          if ((Get-Item "$env:RUNNER_TEMP\preview.png").Length -lt 20000) { throw "the preview wasn't drawn" }
          Run "--look $env:RUNNER_TEMP\stick --selftest-look"   # opens the Look window, closes it
          Run "--look $env:RUNNER_TEMP\stick --theme off"       # the plain one: Standby, its icons in grey
          if ((Get-Content -Raw "$env:RUNNER_TEMP\stick\ventoy\theme\theme.txt") -notmatch "Standby") { throw "off isn't Standby" }
          if (-not (Test-Path "$env:RUNNER_TEMP\stick\ventoy\theme\NanumMyeongjo-Regular18.pf2")) { throw "Standby's font is missing" }
          Run "--look $env:RUNNER_TEMP\stick --reset-look"
          Run "--look $env:RUNNER_TEMP\stick --theme ember --icons badges"
          Run "--look $env:RUNNER_TEMP\stick --export-look $env:RUNNER_TEMP\look.zip"   # put on stick2 below
          Run "--look $env:RUNNER_TEMP\stick --reset-look"

          # Reading the stick back: everything as it was put there; then one damaged image is found
          Run "--check $env:RUNNER_TEMP\stick"
          $iso = Get-ChildItem -Recurse -File "$env:RUNNER_TEMP\stick\ISO" | Select-Object -First 1
          $bytes = [IO.File]::ReadAllBytes($iso.FullName); $bytes[0] = $bytes[0] -bxor 0xFF
          [IO.File]::WriteAllBytes($iso.FullName, $bytes)
          $p = Start-Process $exe -ArgumentList "--check $env:RUNNER_TEMP\stick" -PassThru -NoNewWindow -Wait
          if ($p.ExitCode -ne 1) { throw "--check didn't notice a damaged image ($($p.ExitCode))" }
          Run "--sync-to $env:RUNNER_TEMP\stick"                # copies it again
          Run "--check $env:RUNNER_TEMP\stick"
          Run "--updates"                                     # which tools have newer versions

          # A pack made from that cache, used by the real .exe: fills a stick offline, Ventoy included
          $env:HELIX_CACHE = "$env:LOCALAPPDATA\HelixBoot\cache"
          $env:PYTHONIOENCODING = "utf-8"
          $pack = "$env:RUNNER_TEMP\packs\helix-boot-ci.zip"
          python helix pack $pack
          if ($LASTEXITCODE) { throw "helix pack failed" }
          $vpack = python helix ventoy-path --from $pack
          if ($LASTEXITCODE -or -not (Test-Path "$vpack\Ventoy2Disk.exe")) { throw "no Windows Ventoy in the pack: $vpack" }
          New-Item -ItemType Directory "$env:RUNNER_TEMP\stick2" | Out-Null
          Run "--unpack-to $env:RUNNER_TEMP\stick2 --init --pack $pack"
          foreach ($f in "ventoy\ventoy.json", "Apps\HelixApps.cmd", "ventoy\theme\theme.txt") {
            if (-not (Test-Path "$env:RUNNER_TEMP\stick2\$f")) { throw "missing on the stick from the pack: $f" }
          }
          $a = (Get-ChildItem -Recurse -File "$env:RUNNER_TEMP\stick\ISO").Name | Sort-Object
          $b = (Get-ChildItem -Recurse -File "$env:RUNNER_TEMP\stick2\ISO").Name | Sort-Object
          if (Compare-Object $a $b) { throw "the pack gave different boot images than the online sync" }
          Run "--look $env:RUNNER_TEMP\stick2 --import-look $env:RUNNER_TEMP\look.zip"
          if ((Get-Content -Raw "$env:RUNNER_TEMP\stick2\ventoy\theme\theme.txt") -notmatch "Ember") { throw "the saved look didn't load" }
          Run "--check $env:RUNNER_TEMP\stick2"

          Copy-Item $pack $dir                                # a pack beside the app: the window finds it
          Run "--selftest-gui"                                # opens the window, closes it
          # ...and started the way Explorer starts it: no console to inherit, so the app's
          # stdout/stderr are None. A crash here shows PyInstaller's modal error box, which hangs.
          $p = Start-Process $exe -ArgumentList "--selftest-gui" -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "the app hung or crashed when started without a console" }
          if ($p.ExitCode) { throw "the app failed when started without a console ($($p.ExitCode))" }
          if (-not (Select-String -Quiet -Path "$dir\helix-boot.log" -Pattern "Pack found beside the app")) {
            throw "the window didn't pick up the pack beside it"
          }

      - name: A picture of the Look preview
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: look-preview
          path: ${{ runner.temp }}/preview.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: HelixBoot-windows
          path: dist/HelixBoot.exe

  # The Mac program: helix-mac as one file with Python inside, built and tried on a Mac.
  # Once on Apple Silicon (HelixBoot-mac-arm64) and once on an Intel Mac (HelixBoot-mac-x86_64).
  mac-app:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build HelixBoot-mac
        run: |
          pip install --disable-pip-version-check --require-hashes -r mac/requirements.txt
          pyinstaller --noconfirm mac/HelixBoot-mac.spec
          mv dist/HelixBoot-mac "dist/HelixBoot-mac-$(uname -m)"
          ls -l dist
      - name: Try the real program
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/app" && cp dist/HelixBoot-mac-* "$RUNNER_TEMP/app/HelixBoot-mac"
          app="$RUNNER_TEMP/app/HelixBoot-mac"
          "$app" --help
          "$app" list
          "$app" helix --version
          "$app" helix fetch ventoy supergrub2 memtest86plus
          test -d "$RUNNER_TEMP/app/byo"                      # your folder is the one beside the program
          # A whole update with it, on a disk image partitioned like a stick
          mkfile -n 700m "$RUNNER_TEMP/stick.img"
          dev=$(hdiutil attach -imagekey diskimage-class=CRawDiskImage -nomount "$RUNNER_TEMP/stick.img" | awk 'NR==1 { print $1 }')
          "$app" install --disk "${dev#/dev/}" --erase "${dev#/dev/}" --no-fetch --allow-disk-image --test
          test -f /Volumes/HelixBoot/ventoy/ventoy.json
          test -f /Volumes/HelixBoot/Tools.txt
          test -f /Volumes/HelixBoot/ventoy/theme/splash/20.jpg   # the loading bar: Pillow is inside
          "$app" check --disk "${dev#/dev/}"
          "$app" look --disk "${dev#/dev/}" --theme midnight
          grep -q Midnight /Volumes/HelixBoot/ventoy/theme/theme.txt
          hdiutil detach "$dev" || { sleep 10; hdiutil detach -force "$dev"; }   # macOS holds a disk a moment
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: HelixBoot-mac-${{ matrix.runner }}
          path: dist/HelixBoot-mac-*

  # A pushed v* tag, or "Run workflow" on main with a version: the release (and its tag,
  # at this commit) is created from the .exe the job above built and tested, by a job of its
  # own, the only one with write access.
  release:
    needs: [app, mac-app]
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release != '' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write       # the attestation below: signed with this run's identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: HelixBoot-windows
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: HelixBoot-mac-*
          merge-multiple: true
          path: dist
      - name: Build HelixBoot.sh (the one-file Linux installer)
        run: linux/build.sh dist/HelixBoot.sh
      # Anyone can check a download: sha256sum -c SHA256SUMS, or
      # gh attestation verify HelixBoot.exe --repo Commanderx-code/helix-boot (built here, from this commit)
      - name: Checksums
        run: cd dist && ls HelixBoot-mac-arm64 HelixBoot-mac-x86_64 && sha256sum HelixBoot.exe HelixBoot.sh HelixBoot-mac-* > SHA256SUMS && cat SHA256SUMS
      - name: Attest where the files were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      # The release page says what changed: this version's section of CHANGELOG.md, with how to
      # check a download under it. (A version the changelog doesn't have yet stops the release.)
      - name: Release notes
        env:
          VERSION: ${{ inputs.release || github.ref_name }}
        run: |
          {
            scripts/release-notes.sh "$VERSION"
            printf '\n---\n**Checking a download:** `sha256sum -c SHA256SUMS`, or '
            printf '`gh attestation verify HelixBoot.exe --repo %s`.\n' "$GITHUB_REPOSITORY"
          } > notes.md
          cat notes.md
      - name: Publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Helix Boot ${{ inputs.release || github.ref_name }}
          body_path: notes.md
          generate_release_notes: true      # (adds the "Full Changelog" link under it)
          files: |
            dist/HelixBoot.exe
            dist/HelixBoot.sh
            dist/HelixBoot-mac-*
            dist/SHA256SUMS
