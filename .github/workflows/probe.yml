name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe memtest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "GITHUB RELEASE:"
            curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/memtest86plus/memtest86plus/releases?per_page=3 \
              | python3 -c 'import sys,json
          for r in json.load(sys.stdin): print(r["tag_name"], r["draft"], r["prerelease"], [a["name"] for a in r["assets"]], (r.get("body") or "")[:300].replace("\n"," "))'
            echo "MEMTEST.ORG LINKS:"
            curl -sL -m 30 https://www.memtest.org/ | grep -oE 'href="[^"]*"' | grep -iE 'iso|zip|download' | sort -u | head -30
            for u in https://www.memtest.org/download/v8.10/mt86plus_8.10_64.iso.zip https://memtest.org/download/v8.10/mt86plus_8.10.iso.zip; do
              echo "$u -> $(curl -sIL -o /dev/null -w '%{http_code}' "$u")"
            done
          } > /tmp/out.txt 2>&1
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' /tmp/out.txt)
          echo "::notice title=memtest::$msg"
