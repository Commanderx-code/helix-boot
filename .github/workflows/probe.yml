name: probe
on: push
jobs:
  urls:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: |
          links() { echo "== $1"; curl -sL -m 30 -A "Mozilla/5.0" "$1" | grep -oiE 'href="[^"]+"' | grep -iE "$2" | sort -u | head -25; }
          links https://www.memtest86.com/download.htm '\.(zip|iso|img|sha256|txt)'
          links https://www.memtest86.com/ 'download|\.zip'
          links https://www.hdat2.com/ 'download|\.iso|\.zip|\.img'
          links https://www.hdat2.com/download.html '\.iso|\.zip|\.img|md5|sha'
          links https://www.diskgenius.com/download.php '\.zip|\.exe'
          links https://www.diskgenius.com/ 'download'
          echo "== github search lockpick"
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/search/repositories?q=lockpick+jayro" | python3 -c 'import json,sys; [print(r["full_name"], r["pushed_at"], r["html_url"]) for r in json.load(sys.stdin).get("items",[])[:10]]'
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/search/repositories?q=%22Jayro%27s+Lockpick%22" | python3 -c 'import json,sys; [print(r["full_name"], r["pushed_at"]) for r in json.load(sys.stdin).get("items",[])[:10]]'
          links https://medicatusb.com/ 'lockpick|jayro'
          links https://www.medicatusb.com/ 'lockpick|jayro'
          echo "== boot-repair"
          curl -sL -m 30 "https://sourceforge.net/projects/boot-repair-cd/rss?path=/" | grep -oE '<(link|pubDate)>[^<]+' | head -8
