name: probe
on: push
jobs:
  urls:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cd "$RUNNER_TEMP"
          for u in https://www.memtest86.com/downloads/memtest86-usb.zip https://www.memtest86.com/downloads/memtest86-iso.zip; do
            echo "== $u: $(curl -sIL -m 30 -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$u")"
          done
          curl -sL -m 120 -o mt.zip https://www.memtest86.com/downloads/memtest86-usb.zip && unzip -l mt.zip | head -20
          curl -sL -m 60 -A Mozilla/5.0 https://www.memtest86.com/download.htm | grep -oiE '(sha-?256|md5)[^<]{0,120}' | head -5
          curl -sL -m 180 -o dg.zip "https://www.diskgenius.com/dyna_download/?software=DGEng6201829_x64.zip"; file dg.zip; unzip -l dg.zip | grep -iE '\.exe$' | head -10
          curl -sL -m 60 -A Mozilla/5.0 https://www.hdat2.com/download.html | grep -oiE '(md5|sha)[^<]{0,100}' | head -5
