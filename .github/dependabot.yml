# Keeps what CI is pinned to up to date, a weekly pull request per group: the GitHub Actions
# (exact commits, see .github/workflows), and what the released programs are built with
# and the tests draw with (exact, checksummed versions: the requirements.txt in windows/, mac/ and tests/).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directories: ["/windows", "/mac", "/linux", "/tests"]
    schedule:
      interval: weekly
    groups:
      build-tools:
        patterns: ["*"]
