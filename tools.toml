# ── Portable apps (loaded by Commander PE from USB:\Apps) ─────────────────
[[tool]]
name = "sysinternals"
title = "Sysinternals Suite"
kind = "app"
source = "url"
url = "https://download.sysinternals.com/files/SysinternalsSuite.zip"
entry = "procexp64.exe"
checksum = ["tofu"]

[[tool]]
name = "explorerpp"
title = "Explorer++"
kind = "app"
source = "github"
repo = "derceg/explorerplusplus"
asset = ['explorerpp_x64\.zip$']   # no version in the file name → release tag is used
entry = "Explorer++.exe"
checksum = ["github-digest", "tofu"]

[[tool]]
name = "notepadpp"
title = "Notepad++"
kind = "app"
source = "github"
repo = "notepad-plus-plus/notepad-plus-plus"
asset = ['^npp\.[\d.]+\.portable\.x64\.zip$']
version = 'npp\.([\d.]+)\.portable'
entry = "notepad++.exe"
checksum = ["github-digest", { asset = 'checksums\.sha256$' }]

[[tool]]
name = "crystaldiskinfo"
title = "CrystalDiskInfo"
kind = "app"
source = "sourceforge"
project = "crystaldiskinfo"
path = "/"
asset = ['^CrystalDiskInfo\d[\d_]*\.zip$']
version = 'CrystalDiskInfo([\d_]+)\.zip'
entry = "DiskInfo64.exe"
checksum = ["sf-md5"]

[[tool]]
name = "crystaldiskmark"
title = "CrystalDiskMark"
kind = "app"
source = "sourceforge"
project = "crystaldiskmark"
path = "/"
asset = ['^CrystalDiskMark\d[\d_]*\.zip$']
version = 'CrystalDiskMark([\d_]+)\.zip'
entry = "DiskMark64.exe"
checksum = ["sf-md5"]

[[tool]]
name = "hwinfo"
title = "HWiNFO"
kind = "app"
source = "sourceforge"
project = "hwinfo"
path = "/"
asset = ['^hwi_?\d+\.zip$']
version = 'hwi_?(\d+)\.zip'
entry = "HWiNFO64.exe"
checksum = ["sf-md5"]

[[tool]]
name = "testdisk"
title = "TestDisk & PhotoRec"
kind = "app"
source = "url"
url = "https://www.cgsecurity.org/testdisk-7.2.win64.zip"   # bump by hand
version_pin = "7.2"
entry = "testdisk-7.2/qphotorec_win.exe"
checksum = ["tofu"]

[[tool]]
name = "produkey"
title = "ProduKey"
kind = "app"
source = "url"
url = "https://www.nirsoft.net/utils/produkey-x64.zip"
entry = "ProduKey.exe"
checksum = ["tofu"]

[[tool]]
name = "diskgenius"
title = "DiskGenius Free"
kind = "app"
source = "page"
page = "https://www.diskgenius.com/download.php"
asset = ['DGEng\d+_x64\.zip$']
version = 'DGEng(\d+)_x64'
entry = "DiskGenius/DiskGenius.exe"
checksum = ["tofu"]

# Malware scanners that run inside Commander PE / Hiren's from USB:\Apps.
# Single self-contained .exe files with today's definitions.
[[tool]]
name = "kvrt"
title = "Kaspersky Virus Removal Tool"
kind = "app"
enabled = false            # Kaspersky blocks downloads from the US; enable in local.toml elsewhere
source = "url"
url = "https://devbuilds.s.kaspersky-labs.com/devbuilds/KVRT/latest/full/KVRT.exe"
entry = "KVRT.exe"
checksum = ["tofu"]

[[tool]]
name = "msert"
title = "Microsoft Safety Scanner"
kind = "app"
source = "url"
url = "https://go.microsoft.com/fwlink/?LinkId=212732"   # x64; expires 10 days after download
file = "msert.exe"
entry = "msert.exe"
checksum = ["tofu"]
