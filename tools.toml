# Helix Boot — tool manifest
#
# Every ISO, portable app and the Ventoy loader itself is described here.
# `helix fetch` resolves the newest upstream release of each enabled entry,
# downloads it, and verifies it before anything touches your USB stick.
#
# Personal tweaks go in `local.toml` (git-ignored), so this file stays clean:
#
#   [overrides.hirens]
#   enabled = true
#
#   [[tool]]            # add your own entries with the same schema as below
#   name = "my-tool"
#   ...
#
# ── Schema ─────────────────────────────────────────────────────────────────
#   name        unique id (also the cache folder name)
#   title       pretty name shown in the Ventoy menu / PE app list
#   kind        "iso" | "app" | "ventoy" | "file" (copied to `dest` on the stick)
#               | "tree" (unpacked with 7-Zip into `dest`, installed once: see portableapps)
#   category    one of the [[category]] ids below (iso only)
#               icon: theme/icons/<name>.png, or your own in byo/icons/<name>.png
#   platform    "mac" on an app for a Mac: it goes in the stick's Mac folder as downloaded
#   macos       with it: the oldest macOS the app runs on, as the app itself declares ("10.13",
#               "15.6"); shown in the stick's Mac/README.txt, and checked on a real Mac in CI
#   settings    on an app: files it rewrites as it runs, as patterns (["*.xml"]). A change to
#               one of those, or to any .ini .cfg .conf .log, isn't taken for damage, so an
#               update that verifies leaves the tool's settings alone. Never a program file.
#   enabled     include in fetch/sync (default true)
#   flagged     true on a tool that antivirus programs are known to stop being written. The
#               Windows app says so before an install and offers to leave it out. Only for
#               tools seen to be blocked, not ones that might be.
#   source      "github" | "sourceforge" | "url" | "page" | "local"
#     github:       repo = "owner/name"   (+ optional download_template when the
#                   release has no files: "https://site/v{version}/file-{version}.iso")
#     sourceforge:  project = "name", path = "/folder"
#     url:          url = "https://..."
#     page:         page = "https://site/downloads", a page whose links carry the version; `asset`
#                   picks among its links. Only links to the page's own site count, or to one named
#                   in hosts = ["downloads.example.org"], and never one that drops from https.
#     local:        path = "relative/to/repo.iso"
#   asset       list of regexes tried in order against release file names;
#               the first regex that matches anything wins
#   version     optional regex applied to the file name (capture groups joined with -)
#               (falls back to the GitHub release tag, then to the fetch date)
#   version_pin fixed version string for hand-bumped `url` sources
#   extract     optional regex: pull a matching member out of a downloaded .zip
#   entry       (apps) the .exe the PE launcher should start
#   platform    (apps) "mac": a tool for a working Mac. It goes in Mac/<name>/ instead of
#               Apps/, as downloaded (.dmg, .pkg, .zip): an unpacked .app doesn't survive exFAT
#   checksum    list of strategies, tried in order; the first that produces a
#               hash is used. The download is rejected if it doesn't match.
#       "github-digest"            sha256 GitHub records for each release asset
#       { asset = "regex" }        another asset in the same GitHub release
#       { sibling = "file" }       a file next to the download ({name} = file name)
#       { url = "https://..." }    a checksum file anywhere
#       { url = "...", regex = "…(hex)…" }  a hash shown on a web page that names the file
#       { sha256 = "hex" }         pinned hash
#       "sf-md5"                   SourceForge's own MD5 (integrity only)
#       "tofu"                     trust on first use: no upstream hash exists,
#                                  so record ours and warn if it ever changes
#                                  without a version bump
#   user_agent  "browser" for sites that refuse anything but a browser (pages and hashes)
#   ventoy_mode "wimboot" | "grub2" | "memdisk": always boot this image in that Ventoy mode
#   description short tip shown at the bottom of the Ventoy menu

[settings]
cache_dir = "~/.cache/helix-boot"
iso_root  = "ISO"
apps_root = "Apps"
mac_root  = "Mac"     # apps with platform = "mac": tools to run on a working Mac
stick_label = "HelixBoot"   # the name a new stick gets (up to 11 letters, digits, - or _); "Ventoy" is Ventoy's own
theme     = "theme"   # Ventoy boot-menu theme (folder in this repo); remove for Ventoy's default

# ── Menu categories (folder order = boot menu order) ──────────────────────
# `description` is the tip under the menu; the icon is theme/icons/cat-<id>.png.
[[category]]
id = "antivirus"
dir = "1-Antivirus"
title = "Antivirus"
description = "Scan for viruses and malware."

[[category]]
id = "imaging"
dir = "2-Backup-and-Recovery"
title = "Backup and Recovery"
description = "Image, clone and restore disks; recover deleted files."

[[category]]
id = "boot-repair"
dir = "3-Boot-Repair"
title = "Boot Repair"
description = "Fix systems that won't boot."

[[category]]
id = "diagnostics"
dir = "4-Diagnostic-Tools"
title = "Diagnostic Tools"
description = "Test RAM and disks."

[[category]]
id = "wipe"
dir = "5-Disk-Wipe"
title = "Disk Wipe"
description = "Securely erase disks. DESTROYS DATA. SSD or NVMe? Use Parted Magic's Erase Disk instead (Partition Tools)."

[[category]]
id = "live"
dir = "6-Live-Operating-Systems"
title = "Live Operating Systems"
description = "Full Windows PE desktops that run from the stick."

[[category]]
id = "partitioning"
dir = "7-Partition-Tools"
title = "Partition Tools"
description = "Resize, move, copy and repair partitions."

[[category]]
id = "password"
dir = "8-Password-Removal"
title = "Password Removal"
description = "Reset or remove Windows account passwords."

[[category]]
id = "windows"
dir = "9-Windows-Recovery"
title = "Windows Recovery"
description = "Windows setup, repair and recovery environments."

# Your own folder for OS installers (Windows, Linux...): drop ISOs into ISO/OSimages on
# the stick, e.g. with a downloader kept there. `user = true`: it's always in the menu
# config, and Ventoy shows it only once it holds a bootable image.
[[category]]
id = "images"
dir = "OSimages"
title = "OS Images"
description = "Windows and Linux installers you add yourself."
user = true

# ── Boot loader ───────────────────────────────────────────────────────────
[[tool]]
name = "ventoy"
title = "Ventoy"
kind = "ventoy"
source = "github"
repo = "ventoy/Ventoy"
asset = ['^ventoy-[\d.]+-linux\.tar\.gz$']
version = 'ventoy-([\d.]+)-linux'
windows = { asset = ['^ventoy-[\d.]+-windows\.zip$'], version = 'ventoy-([\d.]+)-windows' }
checksum = [{ asset = '^sha256\.txt$' }, "github-digest"]

# Ventoy only lists .wim boot images (WinRE, WinPE tools) when this plugin is on the
# stick. Published on its own by the Ventoy project; its 2020 release has no GitHub
# digest, so the hash is pinned.
[[tool]]
name = "ventoy-wimboot"
title = "Ventoy wimboot plugin"
kind = "file"
dest = "ventoy/ventoy_wimboot.img"
source = "github"
repo = "ventoy/wimiso"
asset = ['^ventoy_wimboot\.img$']
checksum = [{ sha256 = "05e3aadd3374737546a8545c29405933cff5325b0e26cc605da942bf41a93137" }]

