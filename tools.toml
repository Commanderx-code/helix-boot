# Commander Rescue — tool manifest
#
# Every ISO, portable app and the Ventoy loader itself is described here.
# `crescue fetch` resolves the newest upstream release of each enabled entry,
# downloads it, and verifies it before anything touches your USB stick.
#
# Personal tweaks go in `local.toml` (git-ignored), so this file stays clean:
#
#   [overrides.hirens]
#   enabled = true
#
#   [[tool]]            # add your own entries with the same schema as below
#   name = "my-tool"
#   ...
#
# ── Schema ─────────────────────────────────────────────────────────────────
#   name        unique id (also the cache folder name)
#   title       pretty name shown in the Ventoy menu / PE app list
#   kind        "iso" | "app" | "ventoy"
#   category    one of the [[category]] ids below (iso only)
#               icon: theme/icons/<name>.png, or your own in byo/icons/<name>.png
#   enabled     include in fetch/sync (default true)
#   source      "github" | "sourceforge" | "url" | "local"
#     github:       repo = "owner/name"   (+ optional download_template when the
#                   release has no files: "https://site/v{version}/file-{version}.iso")
#     sourceforge:  project = "name", path = "/folder"
#     url:          url = "https://..."
#     local:        path = "relative/to/repo.iso"
#   asset       list of regexes tried in order against release file names;
#               the first regex that matches anything wins
#   version     optional regex applied to the file name (capture groups joined with -)
#               (falls back to the GitHub release tag, then to the fetch date)
#   version_pin fixed version string for hand-bumped `url` sources
#   extract     optional regex: pull a matching member out of a downloaded .zip
#   entry       (apps) the .exe the PE launcher should start
#   checksum    list of strategies, tried in order; the first that produces a
#               hash is used. The download is rejected if it doesn't match.
#       "github-digest"            sha256 GitHub records for each release asset
#       { asset = "regex" }        another asset in the same GitHub release
#       { sibling = "file" }       a file next to the download ({name} = file name)
#       { url = "https://..." }    a checksum file anywhere
#       { sha256 = "hex" }         pinned hash
#       "sf-md5"                   SourceForge's own MD5 (integrity only)
#       "tofu"                     trust on first use: no upstream hash exists,
#                                  so record ours and warn if it ever changes
#                                  without a version bump
#   description short tip shown at the bottom of the Ventoy menu

[settings]
cache_dir = "~/.cache/commander-rescue"
iso_root  = "ISO"
apps_root = "Apps"
theme     = "theme"   # Ventoy boot-menu theme (folder in this repo); remove for Ventoy's default

# ── Menu categories (folder order = boot menu order) ──────────────────────
# `description` is the tip under the menu; the icon is theme/icons/cat-<id>.png.
[[category]]
id = "antivirus"
dir = "1-Antivirus"
title = "Antivirus"
description = "Scan for viruses and malware."

[[category]]
id = "imaging"
dir = "2-Backup-and-Recovery"
title = "Backup and Recovery"
description = "Image, clone and restore disks; recover deleted files."

[[category]]
id = "boot-repair"
dir = "3-Boot-Repair"
title = "Boot Repair"
description = "Fix systems that won't boot."

[[category]]
id = "diagnostics"
dir = "4-Diagnostic-Tools"
title = "Diagnostic Tools"
description = "Test RAM and disks."

[[category]]
id = "wipe"
dir = "5-Disk-Wipe"
title = "Disk Wipe"
description = "Securely erase disks. DESTROYS DATA."

[[category]]
id = "live"
dir = "6-Live-Operating-Systems"
title = "Live Operating Systems"
description = "Full Windows PE and Linux desktops that run from the stick."

[[category]]
id = "partitioning"
dir = "7-Partition-Tools"
title = "Partition Tools"
description = "Resize, move, copy and repair partitions."

[[category]]
id = "password"
dir = "8-Password-Removal"
title = "Password Removal"
description = "Reset or remove Windows account passwords."

[[category]]
id = "windows"
dir = "9-Windows-Recovery"
title = "Windows Recovery"
description = "Windows setup, repair and recovery environments."

# ── Boot loader ───────────────────────────────────────────────────────────
[[tool]]
name = "ventoy"
title = "Ventoy"
kind = "ventoy"
source = "github"
repo = "ventoy/Ventoy"
asset = ['^ventoy-[\d.]+-linux\.tar\.gz$']
version = 'ventoy-([\d.]+)-linux'
windows = { asset = ['^ventoy-[\d.]+-windows\.zip$'], version = 'ventoy-([\d.]+)-windows' }
checksum = [{ asset = '^sha256\.txt$' }, "github-digest"]

# ── Live operating systems ────────────────────────────────────────────────
[[tool]]
name = "commander-pe"
title = "Commander PE (Windows 11)"
kind = "iso"
category = "live"
source = "local"
path = "pe/out/CommanderPE.iso"
description = "Your own PhoenixPE build. Portable apps load from the USB's Apps folder."

[[tool]]
name = "hirens"
title = "Hiren's BootCD PE"
kind = "iso"
category = "live"
source = "url"
url = "https://www.hirensbootcd.org/files/HBCD_PE_x64.iso"
checksum = ["tofu"]
description = "Ready-made Win11 PE with its own tool set. The Apps launcher works here too."

[[tool]]
name = "systemrescue"
title = "SystemRescue"
kind = "iso"
category = "live"
source = "sourceforge"
project = "systemrescuecd"
path = "/sysresccd-x86"
asset = ['^systemrescue-[\d.]+-amd64\.iso$']
version = 'systemrescue-([\d.]+)-amd64'
checksum = [{ sibling = "{name}.sha512" }, { sibling = "{name}.sha256" }, "sf-md5"]
description = "Arch-based rescue shell: chntpw, testdisk, ddrescue, fsck, network tools."

# ── Imaging ───────────────────────────────────────────────────────────────
[[tool]]
name = "rescuezilla"
title = "Rescuezilla"
kind = "iso"
category = "imaging"
source = "github"
repo = "rescuezilla/rescuezilla"
# Prefer the newest Ubuntu LTS base; fall back to any 64-bit build.
asset = ['64bit\.noble\.iso$', '64bit\.[a-z]+\.iso$']
version = 'rescuezilla-([\d.]+)-'
checksum = ["github-digest", { asset = '(?i)sha256' }]
description = "Point-and-click backup, restore and clone (Clonezilla-compatible)."

[[tool]]
name = "clonezilla"
title = "Clonezilla"
kind = "iso"
category = "imaging"
source = "sourceforge"
project = "clonezilla"
path = "/clonezilla_live_stable"
asset = ['^clonezilla-live-[\d.]+-\d+-amd64\.iso$']
version = 'clonezilla-live-([\d.]+-\d+)-amd64'
checksum = [{ url = "https://clonezilla.org/downloads/stable/data/CHECKSUMS.TXT" }, { sibling = "CHECKSUMS.TXT" }, "sf-md5"]
description = "Disk and partition imaging, multicast deployment, bare-metal restore."

# ── Partitioning ──────────────────────────────────────────────────────────
[[tool]]
name = "gparted"
title = "GParted Live"
kind = "iso"
category = "partitioning"
source = "sourceforge"
project = "gparted"
path = "/gparted-live-stable"
asset = ['^gparted-live-[\d.]+-\d+-amd64\.iso$']
version = 'gparted-live-([\d.]+-\d+)-amd64'
checksum = [{ url = "https://gparted.org/gparted-live/stable/CHECKSUMS.TXT" }, { sibling = "CHECKSUMS.TXT" }, "sf-md5"]
description = "Resize, move, copy and repair partitions."

# ── Diagnostics ───────────────────────────────────────────────────────────
[[tool]]
name = "memtest86plus"
title = "Memtest86+"
kind = "iso"
category = "diagnostics"
source = "github"
repo = "memtest86plus/memtest86plus"
# Releases are tagged on GitHub but the ISOs are published on memtest.org.
download_template = "https://www.memtest.org/download/v{version}/mt86plus_{version}_x86_64.iso.zip"
extract = '\.iso$'
checksum = [{ sibling = "sha512sum.txt" }, { sibling = "sha256sum.txt" }]
description = "RAM tester (UEFI and BIOS)."


# ── Secure wipe ───────────────────────────────────────────────────────────
[[tool]]
name = "shredos"
title = "ShredOS (nwipe)"
kind = "iso"
category = "wipe"
source = "github"
repo = "PartialVolume/shredos.x86_64"
asset = ['x86-64.*\.iso$']
version = 'shredos-([\d.]+_\d+)_x86-64_v?([\d.]+)_'
checksum = ["github-digest", { asset = '{name}\.sha(1|256)$' }]
description = "Boots straight into nwipe. DESTROYS DATA on the disks you select."

# ── Boot repair ───────────────────────────────────────────────────────────
[[tool]]
name = "supergrub2"
title = "Super GRUB2 Disk"
kind = "iso"
category = "boot-repair"
source = "sourceforge"
project = "supergrub2"
path = "/"
asset = ['^supergrub2-classic-[\d.]+s\d+-multiarch-CD\.iso$']
version = 'supergrub2-classic-([\d.]+s\d+)-multiarch'
checksum = [{ sibling = "{name}.sha256" }, "sf-md5"]
description = "Finds and boots installed Linux/Windows when their bootloader is broken."

[[tool]]
name = "boot-repair-disk"
title = "Boot-Repair-Disk"
kind = "iso"
category = "boot-repair"
source = "sourceforge"
project = "boot-repair-cd"
path = "/"
asset = ['^boot-repair-disk-64bit\.iso$']
checksum = ["sf-md5"]
description = "Live desktop with one-click GRUB/boot repair."

# ── Malware scan (bootable) ───────────────────────────────────────────────
# Neither publishes checksums, so both are trust-on-first-use. Their virus
# databases are baked in: refresh.sh keeps them current.
[[tool]]
name = "kaspersky-rd"
title = "Kaspersky Rescue Disk"
kind = "iso"
category = "antivirus"
enabled = false            # Kaspersky blocks downloads from the US; enable in local.toml elsewhere
source = "url"
url = "https://rescuedisk.s.kaspersky-labs.com/updatable/2018/krd.iso"
checksum = ["tofu"]
description = "Offline malware scan and cleanup of Windows installs. Free for personal use."

[[tool]]
name = "drweb-livedisk"
title = "Dr.Web LiveDisk"
kind = "iso"
category = "antivirus"
source = "url"
url = "https://download.geo.drweb.com/pub/drweb/livedisk/drweb-livedisk-900-cd.iso"
checksum = ["tofu"]
description = "Second-opinion offline malware scanner. Free."

