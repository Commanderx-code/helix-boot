# ── PortableApps.com Platform ─────────────────────────────────────────────
# Start.exe and PortableApps\ at the root of the stick, like MediCat. It goes on
# once; after that you add apps from its App Store and it updates them (and
# itself), so refresh.sh never overwrites or prunes it. Lazarus PE opens it at
# startup. Unpacking the installer needs 7-Zip, so the Windows app skips it.
[[tool]]
name = "portableapps"
title = "PortableApps.com Platform"
kind = "tree"
dest = ""
once = "PortableApps/PortableApps.com/PortableAppsPlatform.exe"
# The Platform draws its PortableApps.com logo over the menu's bottom-right corner, on
# top of any theme. This makes that one image transparent (same size, nothing else
# changes; the original is kept in Data), re-applied after the Platform updates itself.
hide_logo = "PortableApps/PortableApps.com/PortableAppsPlatform.exe"
# Its search box icons are near-black, lost on the dark boxes of our themes: a mid teal
# reads on dark and light boxes alike (same shape, recoloured in place).
recolor = { imgLiveSearchIcon = "2AA9BE", imgLiveSearchClose = "2AA9BE" }
drop = ['^\$PLUGINSDIR(/|$)']
source = "page"
page = "https://portableapps.com/download"
hosts = ["downloads.sourceforge.net"]      # where its download link points; other sites' links are ignored
user_agent = "browser"     # portableapps.com turns away other user agents
asset = ['(?<=downloads\.sourceforge\.net/portableapps/)PortableApps\.com_Platform_Setup_[\d.]+\.paf\.exe$']
version = 'Platform_Setup_([\d.]+)\.paf'
checksum = [{ url = "https://portableapps.com/download", regex = 'SHA256 Hash ?: ?([0-9a-fA-F]{64})' }]
windows = { enabled = false }

# The Helix menu themes (portableapps/make-theme.py). The Platform's picker only
# lists its built-in themes, so they take over the last five: Modern Dark =
# Helix Purple, Retro Light = Electric, Retro Dark = Teal, Smooth Light = Orange,
# Smooth Dark = Red. Copied on every refresh, so a Platform update can't undo them.
[[tool]]
name = "portableapps-themes"
title = "PortableApps.com Helix themes"
kind = "file"
dest = "PortableApps/PortableApps.com/App/Graphics/Themes"
source = "local"
path = "portableapps/themes"
windows = { enabled = false }

# Starting settings for a new stick: opens in Helix Teal. Only written while the
# Platform has no settings of its own, so your choices are never overwritten.
[[tool]]
name = "portableapps-settings"
title = "PortableApps.com starting settings"
kind = "tree"
dest = "PortableApps/PortableApps.com/Data"
once = "PortableAppsMenu.ini"
source = "local"
path = "portableapps/settings"
windows = { enabled = false }

